      nl: [diagnostiek, diagnostisch, doorlooptijd, doorlooptijden, stadiering, beeldvorming, biopt,
           pathologie, moleculaire diagnostiek, moleculaire testen, wgs, vloeibare biopsie, biomarker, biomarkers]

  - id: G10
    theme: care
    title_en: Treatment
    title_nl: Behandeling
    ambition: By 2032, people with cancer will have access to the best possible personalised treatment with minimal burden
    keywords:
