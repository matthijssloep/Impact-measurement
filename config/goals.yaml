# Netherlands Cancer Agenda 2.1 (Nederlands Kanker Collectief, July 2026): the 20 goals.
# Source: https://nederlandskankercollectief.nl/app/uploads/2026/07/2026-0730-The-Netherlands-Cancer-Agenda-2.1.pdf
#
# `ambition` is the goal's 2032 statement from the agenda. Dutch titles are our own translation.
# `featured` marks the agenda's featured goals, which have a published action plan.
#
# Keyword rules (see src/impact/goals.py):
#   * matched case- and accent-insensitively on word boundaries; "re:" prefix = regular expression
#   * a hit in a title scores 3, in an abstract/summary 1; an item needs a score of 2 or more
#     (one title hit, or two different terms in the body)
#   * keep terms specific: generic words ("cancer", "patients", "survival") would link everything
#   * `exclude`: any hit vetoes the goal for that item

goals:
  # ---------------------------------------------------------------- Preventing cancer
  - id: G01
    theme: prevention
    featured: true
    title_en: Smoking behaviour
    title_nl: Rookgedrag
    ambition: By 2032, the number of smokers is reduced to 5% of adults and 0% of young people and pregnant women
    keywords:
      en: [smoking, smoker, smokers, tobacco, cigarette, cigarettes, e-cigarette, vaping, vape, nicotine,
           smoking cessation, quit smoking, "re:\\bsmoke[- ]?free\\b", secondhand smoke, passive smoking]
      nl: [roken, rookgedrag, rokers, tabak, sigaret, sigaretten, e-sigaret, vapen, nicotine, stoppen met roken,
           rookvrij, rookvrije generatie, meeroken]

  - id: G02
    theme: prevention
    title_en: Alcohol consumption
    title_nl: Alcoholgebruik
    ambition: By 2032, pregnant women and under-18s do not drink alcohol; among adults, 65% do not drink alcohol or no more than one glass a day
    keywords:
      en: [alcohol, alcohol consumption, alcohol use, drinking, binge drinking, ethanol, alcoholic beverages]
      nl: [alcohol, alcoholgebruik, alcoholconsumptie, drankgebruik, binge drinken]
    exclude: [alcohol-based, ethanol ablation, alcohol septal, drinking water]

  - id: G03
    theme: prevention
    title_en: UV radiation
    title_nl: UV-straling
    ambition: By 2032, the number of people applying safe sun behaviour advice will have increased by at least 15%
    keywords:
      en: [ultraviolet, uv radiation, uv exposure, sun exposure, sunburn, sunscreen, sun protection, sunbed, sunbeds,
           tanning, solar radiation, sun behaviour, sun behavior]
      nl: [uv-straling, zonkracht, zonnebrand, zonnebrandcreme, zonbescherming, zonnebank, zonnebanken, zongedrag,
           verbranden door de zon]

  - id: G04
    theme: prevention
    title_en: Infectious diseases
    title_nl: Infectieziekten
    ambition: By 2032, infections with the HPV virus, and other infectious diseases that can lead to cancer, are prevented as much as possible
    keywords:
      en: [hpv, human papillomavirus, papillomavirus, hpv vaccination, hpv vaccine, helicobacter, h. pylori,
           hepatitis b, hepatitis c, hbv, hcv, epstein-barr, ebv, hiv, oncogenic virus, oncovirus]
      nl: [hpv-vaccinatie, humaan papillomavirus, baarmoederhalskankervaccin, hepatitis, infectieziekten]

  - id: G05
    theme: prevention
    title_en: Environmental and air pollution
    title_nl: Milieu- en luchtvervuiling
    ambition: By 2032, people are less exposed to environmental and air pollution
    keywords:
      en: [air pollution, air quality, particulate matter, "re:\\bpm ?2\\.5\\b", "re:\\bpm ?10\\b", nitrogen dioxide,
           environmental exposure, occupational exposure, radon, asbestos, pesticide, pesticides, pfas,
           carcinogen, carcinogens, carcinogenic, diesel exhaust, pollution]
      nl: [luchtvervuiling, luchtkwaliteit, fijnstof, stikstofdioxide, milieuvervuiling,
           beroepsmatige blootstelling, asbest, bestrijdingsmiddelen, kankerverwekkend, kankerverwekkende stoffen]

  - id: G06
    theme: prevention
    title_en: Nutrition and exercise
    title_nl: Voeding en bewegen
    ambition: By 2032, people eat healthier and exercise enough
    keywords:
      en: [diet, dietary, nutrition, nutritional, obesity, overweight, physical activity,
           exercise, sedentary, red meat, processed meat, fruit and vegetables, fibre intake, fiber intake,
           energy balance, weight gain]
      nl: [voeding, voedingspatroon, dieet, overgewicht, obesitas, lichamelijke activiteit, bewegen, beweging,
           sedentair gedrag, zitgedrag, rood vlees, bewerkt vlees, groente en fruit, gezond eten]

  # ---------------------------------------------------------------- Early detection
  - id: G07
    theme: early_detection
    title_en: Hereditary predisposition
    title_nl: Erfelijke aanleg
    ambition: By 2032, people who may have a hereditary predisposition can make informed choices for hereditary testing
    keywords:
      en: [hereditary, heritable, germline, familial cancer, family history, genetic counselling, genetic counseling,
           genetic testing, predisposition, brca, brca1, brca2, lynch syndrome, mismatch repair deficiency carriers,
           cascade testing]
      nl: [erfelijk, erfelijkheid, erfelijke aanleg, erfelijkheidsonderzoek, erfelijkheidsadvies, familiaire kanker,
           kiembaan, dragerschap, lynch-syndroom]

  - id: G08
    theme: early_detection
    featured: true
    title_en: Early detection
    title_nl: Vroege opsporing
    ambition: By 2032, disadvantages and barriers to participating in early cancer detection are reduced
    keywords:
      en: [screening, population screening, screening programme, screening program, early detection,
           early diagnosis, mammography, mammographic, colonoscopy, fecal immunochemical test, faecal immunochemical test,
           "re:\\bfit\\b[- ]positive", cervical screening, pap smear, screen-detected, interval cancer, interval cancers,
           overdiagnosis, lung cancer screening, screening participation]
      nl: [bevolkingsonderzoek, bevolkingsonderzoeken, screening, vroege opsporing, vroegopsporing, vroegdiagnostiek,
           mammografie, darmonderzoek, ontlastingstest, uitstrijkje, zelfafnameset, intervalkanker]

  # ---------------------------------------------------------------- Diagnostics, treatment, follow-up & palliative care
  - id: G09
    theme: care
    featured: true
    title_en: Diagnostics
    title_nl: Diagnostiek
    ambition: By 2032, people with cancer will have a personalised diagnosis (more) quickly with minimal burden
    keywords:
      en: [diagnostics, diagnostic accuracy, diagnostic performance, diagnostic pathway, time to diagnosis,
           diagnostic interval, diagnostic delay, staging, imaging, pet-ct, pet/ct, mri, biopsy, pathology,
           histopathology, molecular diagnostics, molecular testing, next-generation sequencing, ngs,
           whole genome sequencing, liquid biopsy, circulating tumor dna, ctdna, biomarker, biomarkers,
