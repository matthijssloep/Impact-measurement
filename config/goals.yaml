  - id: G11
    theme: care
    title_en: Innovations
    title_nl: Innovaties
    ambition: By 2032, innovative and effective diagnostic and treatment methods are more readily available
    keywords:
      en: [innovation, innovations, innovative, market access, reimbursement, health technology assessment, hta,
